name: On Open PR to main

on:
  workflow_call:

permissions:
  pull-requests: write
  contents: read

jobs:
  apply-release-template:
    if: github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: SKJOLDETDK/.github
          ref: main
          path: central-github

      - name: Read template
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --body-file central-github/.github/PULL_REQUEST_TEMPLATE/release_PR_template.md
        env:
          GH_TOKEN: ${{ github.token }}
